name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who needs it (students, teachers, IT staff) and why?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
  - type: checkboxes
    id: weight
    attributes:
      label: Keeping CodeLab light
      options:
        - label: I understand CodeLab aims to stay small, offline and simple, and this idea fits that.
          required: true
