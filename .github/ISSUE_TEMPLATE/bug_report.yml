name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For a **security** problem, don't use this form. See SECURITY.md.
  - type: input
    id: version
    attributes:
      label: CodeLab version
      description: The version of the installer you used, for example 1.0.0, or "built from source".
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2, 64-bit
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [Python, JavaScript, C, "C++", Not language-specific]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The code you ran (and the Input box contents), step by step.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
      description: Paste the Output box text, or describe it. Screenshots are welcome.
    validations:
      required: true
